<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Optimized Route</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>

<div class="container my-4">
    <div class="text-center mb-4">
        <h2 class="fw-light"><i class="bi bi-map"></i> Optimized Delivery Route</h2>
        <p class="text-muted">Stops are ordered by Nearest Neighbor algorithm to minimize total distance</p>
    </div>

    <div th:if="${route == null or route.isEmpty()}">
        <div class="alert alert-info text-center">
            <i class="bi bi-info-circle"></i> No active shipments to build a route.
        </div>
    </div>

    <div th:if="${route != null and !route.isEmpty()}">

        <!-- Summary -->
        <div class="alert alert-success d-flex align-items-center mb-4">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span>
                <strong th:text="${route.size()}"></strong> stops &nbsp;|&nbsp;
                Total distance: <strong th:text="${route[route.size()-1].totalDistanceKm} + ' km'"></strong>
            </span>
        </div>

        <!-- Route steps -->
        <div class="list-group shadow-sm">
            <div class="list-group-item py-3" th:each="step : ${route}">
                <div class="d-flex align-items-start gap-3">

                    <!-- Step number badge -->
                    <span class="badge bg-primary rounded-pill fs-6"
                          style="min-width: 2rem; text-align: center;"
                          th:text="${step.step}">
                    </span>

                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between">
                            <h6 class="mb-1" th:text="${step.receiverFullName}"></h6>
                            <small class="text-muted">
                                <i class="bi bi-pin-map"></i>
                                <span th:text="${step.distanceFromPrevKm} + ' km from prev'"></span>
                            </small>
                        </div>
                        <p class="mb-1 text-muted">
                            <i class="bi bi-geo-alt"></i>
                            <span th:text="${step.receiverAddress}"></span>
                        </p>
                        <small class="text-muted">
                            Cumulative: <strong th:text="${step.totalDistanceKm} + ' km'"></strong>
                        </small>
                    </div>

                    <a th:href="@{/map/courier/{id}(id=${step.orderId})}"
                       class="btn btn-sm btn-outline-primary align-self-center">
                        <i class="bi bi-map"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:insert="~{blocks/footer :: footer}"></footer>
</body>
</html>
