<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CourierOrders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>

<div class="container my-4">
    <div class="text-center mb-4">
        <h2 class="fw-light"><i class="bi bi-box-seam"></i> Available Delivery Requests</h2>
        <p class="text-muted">Select one of the available delivery requests below</p>
    </div>

    <div th:switch="${orders}">
        <div th:case="null">
            <div class="alert alert-info text-center">
                <i class="bi bi-info-circle"></i> There are no delivery requests now!
            </div>
        </div>

        <div th:case="*">
            <div class="list-group shadow-sm">
                <div class="list-group-item list-group-item-action py-3" th:each="order, iterStat : ${orders}">
                    <div class="d-flex w-100 justify-content-between">
                        <h5 class="mb-1">Delivery Request #<span th:text="${iterStat.count}"></span></h5>
                        <small>
                            <a th:href="@{/couriers/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-info me-2">
                                <i class="bi bi-eye"></i> View
                            </a>
                            <a th:href="@{/map/courier/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary me-2">
                                <i class="bi bi-geo-alt"></i> Turn on geolocation
                            </a>
                        </small>
                    </div>
                    <p class="mb-1">
                        <strong>Receiver:</strong> <span th:text="${order.receiverFullName}"></span>
                    </p>
                    <form th:action="@{/couriers/orders/take}" method="post" class="d-inline">
                        <input type="hidden" name="orderId" th:value="${order.id}">
                        <button type="submit"
                                class="btn btn-sm btn-outline-success"
                                th:if="${order.shipment == null}">
                            <i class="bi bi-check-circle"></i> Accept delivery request
                        </button>
                        <span th:if="${order.shipment != null}"
                              class="badge bg-success">
                            <i class="bi bi-truck"></i> Accepted
                        </span>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{blocks/footer :: footer}"></div>
</body>
</html>
