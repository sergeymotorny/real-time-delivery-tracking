<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Shipments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>

<div class="container my-4">
    <div class="text-center mb-4">
        <h2 class="fw-light"><i class="bi bi-truck"></i> My Shipments</h2>
        <p class="text-muted">All delivery orders assigned to you</p>
    </div>

    <div th:if="${shipments == null or shipments.isEmpty()}">
        <div class="alert alert-info text-center">
            <i class="bi bi-info-circle"></i> You have no assigned shipments yet.
        </div>
    </div>

    <div th:if="${shipments != null and !shipments.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Tracking #</th>
                    <th>Receiver</th>
                    <th>Address</th>
                    <th>Phone</th>
                    <th>Status</th>
                    <th>Accepted at</th>
                    <th>Map</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="shipment : ${shipments}">
                    <td th:text="${shipment.trackingNumber}"></td>
                    <td th:text="${shipment.receiverFullName}"></td>
                    <td th:text="${shipment.receiverAddress}"></td>
                    <td th:text="${shipment.receiverPhone}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${shipment.status?.name() == 'IN_TRANSIT' ? 'bg-primary' : (shipment.status?.name() == 'DELIVERED' ? 'bg-success' : 'bg-secondary')}"
                              th:text="${shipment.status}">
                        </span>
                    </td>
                    <td th:text="${#temporals.format(shipment.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/map/courier/{id}(id=${shipment.orderId})}"
                           class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-geo-alt"></i>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:insert="~{blocks/footer :: footer}"></footer>
</body>
</html>
