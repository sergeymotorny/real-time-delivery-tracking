<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leave Feedback</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>

<div class="container my-4" style="max-width: 600px;">
    <h3 class="fw-light mb-4"><i class="bi bi-star-half"></i> Rate your delivery</h3>

    <!-- Already submitted -->
    <div th:if="${existingFeedback != null}" class="alert alert-success">
        <i class="bi bi-check-circle"></i>
        You already rated this delivery:
        <strong th:text="${existingFeedback.rating} + ' / 5'"></strong>
        <span th:if="${existingFeedback.comment != null and !#strings.isEmpty(existingFeedback.comment)}">
            — <em th:text="${existingFeedback.comment}"></em>
        </span>
    </div>

    <!-- Feedback form -->
    <div th:if="${existingFeedback == null}">
        <form th:action="@{/shipments/{id}/feedback(id=${shipmentId})}"
              th:object="${feedbackDto}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold">Rating (0–5)</label>
                <div class="d-flex gap-2">
                    <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio"
                                   th:field="*{rating}" th:value="${i}" th:id="'star' + ${i}">
                            <label class="form-check-label" th:for="'star' + ${i}">
                                <i class="bi bi-star-fill text-warning"></i>
                                <span th:text="${i}"></span>
                            </label>
                        </div>
                    </th:block>
                </div>
                <div th:if="${#fields.hasErrors('rating')}" class="text-danger small mt-1">
                    <span th:errors="*{rating}"></span>
                </div>
            </div>

            <div class="mb-3">
                <label for="comment" class="form-label fw-semibold">Comment (optional)</label>
                <textarea th:field="*{comment}" id="comment" class="form-control"
                          rows="3" placeholder="Share your experience..."></textarea>
                <div th:if="${#fields.hasErrors('comment')}" class="text-danger small mt-1">
                    <span th:errors="*{comment}"></span>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-send"></i> Submit feedback
                </button>
                <a th:href="@{/users/orders}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<footer th:insert="~{blocks/footer :: footer}"></footer>
</body>
</html>
