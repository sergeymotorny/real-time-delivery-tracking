<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Analytics Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>

<div class="container my-4">
    <h2 class="fw-light mb-4"><i class="bi bi-bar-chart-line"></i> Analytics Dashboard</h2>

    <!-- Summary cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-bg-primary border-0 shadow-sm">
                <div class="card-body">
                    <div class="fs-2 fw-bold" th:text="${analytics.totalOrders}"></div>
                    <div class="text-white-50">Total orders</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-success border-0 shadow-sm">
                <div class="card-body">
                    <div class="fs-2 fw-bold" th:text="${analytics.confirmedOrders}"></div>
                    <div class="text-white-50">Confirmed</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-warning border-0 shadow-sm">
                <div class="card-body">
                    <div class="fs-2 fw-bold" th:text="${analytics.pendingOrders}"></div>
                    <div class="text-white-50">Pending</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-bg-info border-0 shadow-sm">
                <div class="card-body">
                    <div class="fs-2 fw-bold"
                         th:text="${#numbers.formatDecimal(analytics.avgDeliveryHours, 1, 1)} + ' h'"></div>
                    <div class="text-white-50">Avg. acceptance time</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts row 1 -->
    <div class="row g-3 mb-4">
        <!-- Orders per day -->
        <div class="col-md-8">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-light">Orders per day (last 7 days)</div>
                <div class="card-body">
                    <canvas id="ordersPerDayChart" height="100"></canvas>
                </div>
            </div>
        </div>
        <!-- Delivery type split -->
        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-light">Delivery type</div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <canvas id="deliveryTypeChart" height="180"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Charts row 2 -->
    <div class="row g-3 mb-4">
        <!-- Courier workload -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-light">Courier workload (total shipments)</div>
                <div class="card-body">
                    <canvas id="courierWorkloadChart" height="140"></canvas>
                </div>
            </div>
        </div>
        <!-- Priority distribution -->
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-light">Pending orders by priority</div>
                <div class="card-body d-flex align-items-center justify-content-center">
                    <canvas id="priorityChart" style="max-height: 220px; max-width: 220px;"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Pass data from Thymeleaf to JS -->
<script th:inline="javascript">
    const ordersPerDayLabels  = /*[[${analytics.ordersPerDay.keySet()}]]*/ [];
    const ordersPerDayValues  = /*[[${analytics.ordersPerDay.values()}]]*/ [];

    const deliveryTypeLabels  = /*[[${analytics.ordersByDeliveryType.keySet()}]]*/ [];
    const deliveryTypeValues  = /*[[${analytics.ordersByDeliveryType.values()}]]*/ [];

    const courierNames        = /*[[${analytics.courierWorkload.keySet()}]]*/ [];
    const courierCounts       = /*[[${analytics.courierWorkload.values()}]]*/ [];

    const priorityLabels      = /*[[${analytics.ordersByPriority.keySet()}]]*/ [];
    const priorityValues      = /*[[${analytics.ordersByPriority.values()}]]*/ [];
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
    // Orders per day — Line chart
    new Chart(document.getElementById('ordersPerDayChart'), {
        type: 'line',
        data: {
            labels: ordersPerDayLabels,
            datasets: [{
                label: 'Orders',
                data: ordersPerDayValues,
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13,110,253,0.1)',
                tension: 0.3,
                fill: true
            }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });

    // Delivery type — Doughnut
    new Chart(document.getElementById('deliveryTypeChart'), {
        type: 'doughnut',
        data: {
            labels: deliveryTypeLabels,
            datasets: [{
                data: deliveryTypeValues,
                backgroundColor: ['#fd7e14', '#0dcaf0']
            }]
        },
        options: { plugins: { legend: { position: 'bottom' } } }
    });

    // Courier workload — Bar
    new Chart(document.getElementById('courierWorkloadChart'), {
        type: 'bar',
        data: {
            labels: courierNames,
            datasets: [{
                label: 'Shipments',
                data: courierCounts,
                backgroundColor: '#198754'
            }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });

    // Priority — Doughnut
    new Chart(document.getElementById('priorityChart'), {
        type: 'doughnut',
        data: {
            labels: priorityLabels,
            datasets: [{
                data: priorityValues,
                backgroundColor: ['#dc3545', '#ffc107', '#198754']
            }]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } }
        }
    });
</script>

<footer th:insert="~{blocks/footer :: footer}"></footer>
</body>
</html>
