<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CourierTracking</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        #map {
            height: 500px;
            width: 100%;
            margin-bottom: 1rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
<header th:insert="~{blocks/header :: header}"></header>

<div class="container my-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h4 class="card-title mb-3">
                <i class="bi bi-geo-alt-fill text-primary"></i> Courier tracking card
            </h4>

            <p class="card-text">
                <strong>Courier coordinates:</strong>
                <span th:text="${shipment.courierLatitude}">46.975000</span>,
                <span th:text="${shipment.courierLongitude}">32.030000</span>
            </p>
        </div>

        <div id="map"
             th:attr="data-order-lat=${order.latitude},data-order-lng=${order.longitude},
                      data-courier-lat=${shipment.courierLatitude},data-courier-lng=${shipment.courierLongitude}">
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>

<!-- we connect our script -->
<script src="/map-client.js"></script>

<div th:insert="~{blocks/footer :: footer}"></div>
</body>
</html>
